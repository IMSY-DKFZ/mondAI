[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "mondAI"
version = "0.0.1"
description = "Image quality metrics for medical imaging"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Division of Intelligent Medical Systems (IMSY), German Cancer Research Center (DKFZ)", email = "your.email@example.com" }
]
requires-python = ">=3.10"

dependencies = [
    "torch>=2.10",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "ruff",
    "mypy",
    "sphinx",
    "myst-parser"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"



[tool.ruff]
select = ["E", "F", "I", "B"]
line-length = 120

[tool.mypy]
strict = true