[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "mondAI"
version = "0.0.1"
description = "Image quality metrics for medical imaging"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Division of Intelligent Medical Systems (IMSY), German Cancer Research Center (DKFZ)", email = "your.email@example.com" },
]
requires-python = ">=3.10"

dependencies = [
    "torch>=2.10,<3.0",         # BSD-3-Clause
    "numpy>=1.26.4,<2.0",       # BSD-3-Clause and MIT
    "torchvision>=0.25.0,<1.0", # BSD-3-Clause
    "scipy>=1.15.3,<2.0",       # BSD-3-Clause
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",               # MIT
    "pytest-cov==7.1.0",           # MIT
    "pytest-regressions==2.10.0",  # MIT
    "pre-commit==4.5.1",           # MIT
    "ruff==0.15.11",               # MIT
    "mypy==1.20.1",                # MIT
    "sphinx==8.1.3",               # BSD-2-Clause
    "pydata-sphinx-theme==0.17.0", # BSD-3-Clause
    "myst-parser==4.0.1",          # BSD-2-Clause
    "scikit-image==0.25.2",        # BSD-3-Clause, BSD-2-Clause, MIT
    "pooch==1.9.0",                # BSD-3-Clause
    "matplotlib==3.10.8",          # PSF-2.0
]
comparison = [
    "scikit-learn==1.7.2",  # BSD-3-Clause
    "torchmetrics==1.8.2",  # Apache-2.0
    "scikit-image==0.25.2", # BSD-3-Clause, BSD-2-Clause, MIT
    "tensorflow==2.16.1",   # Apache-2.0
    "monai==1.5.1",         # Apache-2.0
    "piq==0.8.0",           # Apache-2.0
    "deepinv==0.4.0",       # BSD-3-Clause
    "piqa==1.3.2",          # MIT
    "sewar==0.4.6",         # MIT
    "pyrtools==1.0.10",     # MIT
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.coverage.run]
omit = [
    'src/mondAI/metrics/.metric_template.py',
    'src/mondAI/metrics/third_party/*',
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "RET", "RUF", "SIM", "UP"]
ignore = ["RET505"]

[tool.docformatter]
wrap-summaries = 87
wrap-descriptions = 87
blank = true
pre-summary-newline = false
make-summary-multi-line = false

[tool.mypy]
strict = true
disallow_untyped_decorators = false

[tool.setuptools.package-data]
mondAI = ["metrics/weights/*.*", "metrics/weights/lpips/*.pth"]
